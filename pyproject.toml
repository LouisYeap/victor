[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "victor-utils"
version = "1.0.0"
description = "General-purpose Python utility library — parallel execution, file I/O, and common helpers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "LouisYeap", email = "louis@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "tqdm>=4.67",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/LouisYeap/victor"
Documentation = "https://github.com/LouisYeap/victor#readme"
Source = "https://github.com/LouisYeap/victor"

[tool.hatch.build.targets.wheel]
packages = ["src/victor"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
